<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="1200" viewBox="0 0 504 600">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2d3631"/><stop offset=".48" stop-color="#111816"/><stop offset="1" stop-color="#343c34"/></linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bd8a31"/><stop offset="1" stop-color="#74471c"/></linearGradient>
    <pattern id="mortar" width="46" height="28" patternUnits="userSpaceOnUse"><path d="M0 1h46M0 27h46M23 1v13M0 14h46M9 14v13" fill="none" stroke="#899287" stroke-opacity=".13"/></pattern>
    <clipPath id="bodyClip"><path d="M35 0H435Q470 0 470 35V125Q470 158 504 158V442Q470 442 470 475V565Q470 600 435 600H35Q0 600 0 565V35Q0 0 35 0Z"/></clipPath>
  </defs>

  <!-- The 470 px body and single central tab follow the physical Mouse Trap insert. -->
  <path d="M35 0H435Q470 0 470 35V125Q470 158 504 158V442Q470 442 470 475V565Q470 600 435 600H35Q0 600 0 565V35Q0 0 35 0Z" fill="url(#stone)" stroke="#090d0b" stroke-width="3"/>
  <g clip-path="url(#bodyClip)">
    <rect width="504" height="600" fill="url(#mortar)"/>
    <!-- Exact keypad cells: x 0/151/301/452 and y 0/143/292/442/600. -->
    <path d="M151 0V600M301 0V600M452 0V600M0 143H470M0 292H504M0 442H504" fill="none" stroke="#99a497" stroke-opacity=".52" stroke-width="2"/>
    <path d="M0 0H151V143H0ZM0 442H151V600H0ZM301 442H452V600H301Z" fill="url(#active)" stroke="#e1b34d" stroke-width="3"/>
    <rect x="5" y="5" width="460" height="590" rx="29" fill="none" stroke="#a2ab9e" stroke-opacity=".35" stroke-width="2"/>
  </g>

  <!-- Large legends occupy the same physical cells as the Mouse Trap insert. -->
  <g font-family="Consolas,monospace" font-size="76" font-weight="700" text-anchor="middle" dominant-baseline="middle">
    <text x="75.5" y="52" fill="#fff1bd">1</text><text x="226" y="72" fill="#d8ded5">2</text><text x="376.5" y="72" fill="#d8ded5">3</text>
    <text x="75.5" y="217.5" fill="#d8ded5">4</text><text x="226" y="217.5" fill="#d8ded5">5</text><text x="376.5" y="217.5" fill="#d8ded5">6</text>
    <text x="75.5" y="367" fill="#d8ded5">7</text><text x="226" y="367" fill="#d8ded5">8</text><text x="376.5" y="367" fill="#d8ded5">9</text>
    <text x="75.5" y="490" fill="#fff1bd">*</text><text x="226" y="521" fill="#d8ded5">0</text><text x="376.5" y="490" fill="#fff1bd">#</text>
  </g>

  <!-- Key 1: drink potion. All artwork stays inside its physical cell. -->
  <g transform="translate(75.5 91)" text-anchor="middle" font-family="Consolas,monospace">
    <path d="M-13-23H13V-14L22-2V25Q22 35 12 35H-12Q-22 35-22 25V-2L-13-14Z" fill="#ded7bb" stroke="#30261f" stroke-width="3"/>
    <path d="M-17 8H17V25Q17 30 11 30H-11Q-17 30-17 25Z" fill="#aa2030"/><path d="M-10-23H10" stroke="#30261f" stroke-width="5"/>
    <text y="47" fill="#fff1bd" font-size="14" font-weight="700" letter-spacing="1">DRINK</text>
  </g>

  <!-- Key *: hero sheet. -->
  <g transform="translate(75.5 545)" text-anchor="middle" font-family="Consolas,monospace">
    <path d="M-24-27H24V17H-24Z" fill="#d8c790" stroke="#342b20" stroke-width="3"/><circle cy="-14" r="7" fill="#4c3825"/>
    <path d="M-13 10Q-11-7 0-7T13 10M-17 14H17" fill="none" stroke="#4c3825" stroke-width="5"/>
    <text y="35" fill="#fff1bd" font-size="13" font-weight="700" letter-spacing="1">HERO SHEET</text>
  </g>

  <!-- Key #: map and floor plan. -->
  <g transform="translate(376.5 544)" text-anchor="middle" font-family="Consolas,monospace">
    <path d="M-31-25L-11-32 9-25 31-33V13L9 21-11 14-31 21Z" fill="#d8c790" stroke="#342b20" stroke-width="3"/>
    <path d="M-11-31V14M9-25V20M-27-10L-11-2 9-12 27-4" fill="none" stroke="#78643c" stroke-width="2"/><circle cx="9" cy="-2" r="5" fill="#aa2030"/>
    <text y="36" fill="#fff1bd" font-size="13" font-weight="700" letter-spacing="1">MAP / FLOOR</text>
  </g>

  <text x="486" y="300" transform="rotate(-90 486 300)" fill="#d5c07b" font-family="Consolas,monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="2">DEEPWARDEN</text>
</svg>

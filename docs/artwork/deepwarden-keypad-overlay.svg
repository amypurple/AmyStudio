<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="1200" viewBox="0 0 504 600">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#27302d"/>
      <stop offset=".48" stop-color="#111816"/>
      <stop offset="1" stop-color="#30382f"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#485147"/>
      <stop offset="1" stop-color="#252c27"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#bd8a31"/>
      <stop offset="1" stop-color="#6c431b"/>
    </linearGradient>
    <pattern id="mortar" width="46" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 1h46M0 27h46M23 1v13M0 14h46M9 14v13" fill="none" stroke="#6a7368" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".65"/>
    </filter>
    <clipPath id="bodyClip">
      <path d="M34 0H438Q470 0 470 34V133H504V213H470V427H504V507H470V566Q470 600 436 600H34Q0 600 0 566V34Q0 0 34 0Z"/>
    </clipPath>
  </defs>

  <path d="M34 0H438Q470 0 470 34V133H504V213H470V427H504V507H470V566Q470 600 436 600H34Q0 600 0 566V34Q0 0 34 0Z" fill="url(#stone)" stroke="#0a0d0c" stroke-width="5"/>
  <g clip-path="url(#bodyClip)"><rect width="504" height="600" fill="url(#mortar)"/></g>
  <path d="M18 22H446V576H18Z" fill="none" stroke="#88917f" stroke-opacity=".38" stroke-width="2"/>

  <g font-family="Consolas,monospace" text-anchor="middle">
    <text x="235" y="29" fill="#e0c06b" font-size="16" font-weight="700" letter-spacing="3">DEEPWARDEN</text>
    <text x="235" y="45" fill="#93a18f" font-size="7" letter-spacing="2">WARDEN'S KEYPAD</text>
  </g>

  <!-- Twelve keypad positions. Only 1, *, and # are game commands. -->
  <g stroke="#7f8a7c" stroke-width="2" filter="url(#shadow)">
    <rect x="25" y="60" width="133" height="112" rx="13" fill="url(#active)" stroke="#e1b34d"/>
    <rect x="168" y="60" width="133" height="112" rx="13" fill="url(#key)"/>
    <rect x="311" y="60" width="133" height="112" rx="13" fill="url(#key)"/>
    <rect x="25" y="182" width="133" height="112" rx="13" fill="url(#key)"/>
    <rect x="168" y="182" width="133" height="112" rx="13" fill="url(#key)"/>
    <rect x="311" y="182" width="133" height="112" rx="13" fill="url(#key)"/>
    <rect x="25" y="304" width="133" height="112" rx="13" fill="url(#key)"/>
    <rect x="168" y="304" width="133" height="112" rx="13" fill="url(#key)"/>
    <rect x="311" y="304" width="133" height="112" rx="13" fill="url(#key)"/>
    <rect x="25" y="426" width="133" height="145" rx="13" fill="url(#active)" stroke="#e1b34d"/>
    <rect x="168" y="426" width="133" height="145" rx="13" fill="url(#key)"/>
    <rect x="311" y="426" width="133" height="145" rx="13" fill="url(#active)" stroke="#e1b34d"/>
  </g>

  <g fill="#889287" font-family="Consolas,monospace" font-size="29" text-anchor="middle" opacity=".7">
    <text x="234" y="106">2</text><text x="377" y="106">3</text>
    <text x="91" y="228">4</text><text x="234" y="228">5</text><text x="377" y="228">6</text>
    <text x="91" y="350">7</text><text x="234" y="350">8</text><text x="377" y="350">9</text>
    <text x="234" y="488">0</text>
  </g>

  <!-- Potion command: keypad 1. -->
  <g transform="translate(91 80)" text-anchor="middle" font-family="Consolas,monospace">
    <text y="18" fill="#fff3c7" font-size="24" font-weight="700">1</text>
    <path d="M-11 27h22v7l8 11v22q0 10-10 10H-9q-10 0-10-10V45l8-11Z" fill="#d8d2b7" stroke="#30261f" stroke-width="3"/>
    <path d="M-14 51h28v17q0 5-6 5H-8q-6 0-6-5Z" fill="#a51f2b"/>
    <path d="M-8 27h16" stroke="#30261f" stroke-width="5"/>
    <text y="96" fill="#fff3c7" font-size="10" font-weight="700" letter-spacing="1">DRINK</text>
  </g>

  <!-- Hero sheet command: keypad *. -->
  <g transform="translate(91 449)" text-anchor="middle" font-family="Consolas,monospace">
    <text y="28" fill="#fff3c7" font-size="37" font-weight="700">*</text>
    <path d="M-25 39h50v48H-25Z" fill="#d6c58e" stroke="#342b20" stroke-width="3"/>
    <circle cy="53" r="8" fill="#4c3825"/>
    <path d="M-14 79q2-18 14-18t14 18M-18 84h36" fill="none" stroke="#4c3825" stroke-width="5"/>
    <text y="96" fill="#fff3c7" font-size="10" font-weight="700" letter-spacing="1">HERO</text>
    <text y="109" fill="#d8bb73" font-size="8" letter-spacing="1">SHEET</text>
  </g>

  <!-- Map command: keypad #. -->
  <g transform="translate(377 449)" text-anchor="middle" font-family="Consolas,monospace">
    <text y="28" fill="#fff3c7" font-size="33" font-weight="700">#</text>
    <path d="M-30 40l20-7 20 7 20-7v48l-20 7-20-7-20 7Z" fill="#d6c58e" stroke="#342b20" stroke-width="3"/>
    <path d="M-10 34v47M10 40v47M-25 53l15 8 20-10 15 8" fill="none" stroke="#78643c" stroke-width="2"/>
    <circle cx="10" cy="61" r="5" fill="#a51f2b"/>
    <text y="96" fill="#fff3c7" font-size="10" font-weight="700" letter-spacing="1">MAP</text>
    <text y="109" fill="#d8bb73" font-size="8" letter-spacing="1">FLOOR PLAN</text>
  </g>
</svg>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amy Chess - ColecoVision Box Art</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #09070d;
      --paper: #f4f0e7;
      --purple: #b73b99;
      --pink: #ec74bd;
      --blue: #2b63b7;
      --gold: #e5bd4f;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--paper);
      background:
        radial-gradient(circle at 50% 20%, #3b2443 0, transparent 38%),
        repeating-linear-gradient(135deg, #09070d 0 2px, #110c16 2px 5px);
    }

    .stage {
      width: min(1120px, 96vw);
      padding: 36px;
      perspective: 1500px;
    }

    .box {
      --h: min(720px, 78vh);
      position: relative;
      width: calc(var(--h) * .77);
      height: var(--h);
      margin: auto;
      transform: rotateY(-7deg) rotateX(1deg);
      transform-style: preserve-3d;
      filter: drop-shadow(32px 35px 26px #000b);
    }

    .panel {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border: 2px solid #040305;
      background: #0a080d;
      box-shadow: inset 0 0 0 1px #ffffff24;
    }

    .front {
      display: grid;
      grid-template-rows: 76px 1fr 105px;
      background:
        linear-gradient(145deg, transparent 68%, #54194888),
        #07060a;
    }

    .brand {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 9px 15px;
      border-bottom: 4px solid var(--purple);
      background: #eeeae0;
      color: #15121a;
      font-family: Arial, sans-serif;
      font-weight: 900;
      letter-spacing: .05em;
    }

    .brand__mark {
      width: 51px;
      height: 51px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      font-size: 27px;
      background: conic-gradient(#ed3b51 0 25%, #e8c03d 0 50%, #39a76a 0 75%, #3275bd 0);
      box-shadow: inset 0 0 0 7px #111;
    }

    .brand__system { font-size: clamp(21px, 3vw, 34px); }
    .brand__system span { color: var(--purple); }
    .brand__badge { font-size: 11px; text-align: right; }

    .hero {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 25px 22px 18px;
      background:
        radial-gradient(ellipse at 55% 45%, #40102f 0, #09070d 55%),
        #09070d;
    }

    .screen-frame {
      width: 100%;
      padding: 13px;
      transform: rotate(-1deg);
      background: #050407;
      border: 1px solid #c95bae;
      box-shadow: 0 0 0 7px #17101b, 0 18px 35px #000;
    }

    .screen-frame img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      image-rendering: pixelated;
      object-fit: contain;
      background: #000;
    }

    .front-copy {
      position: relative;
      display: grid;
      align-content: center;
      padding: 14px 102px 18px 24px;
      border-top: 1px solid #8c2f78;
      background: linear-gradient(90deg, #1b0d1c, #09070d 68%);
    }

    .front-copy strong {
      color: var(--pink);
      font-size: 22px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .front-copy small {
      max-width: 390px;
      margin-top: 7px;
      color: #d8ccd6;
      font: 12px/1.35 Arial, sans-serif;
      letter-spacing: .05em;
    }

    .seal {
      position: absolute;
      right: 22px;
      bottom: 18px;
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      border: 2px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      font: 800 9px/1.05 Arial, sans-serif;
      text-align: center;
      transform: rotate(-8deg);
    }

    .spine {
      inset: 0 auto 0 0;
      width: 58px;
      transform: rotateY(90deg) translateZ(0);
      transform-origin: left center;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(#1c111d, #070609);
    }

    .spine span {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      color: var(--pink);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .credit {
      margin: 26px auto 0;
      color: #bcaebe;
      font: 11px/1.4 Arial, sans-serif;
      letter-spacing: .12em;
      text-align: center;
      text-transform: uppercase;
    }

    @media (max-width: 650px) {
      .stage { padding: 18px 10px; }
      .box { --h: min(610px, 83vh); transform: none; }
      .spine { display: none; }
      .brand { grid-template-columns: 48px 1fr; }
      .brand__mark { width: 42px; height: 42px; font-size: 22px; }
      .brand__badge { display: none; }
      .seal { width: 52px; height: 52px; }
    }

    @media print {
      body { background: white; }
      .stage { width: 100%; padding: 0; }
      .box { --h: 245mm; transform: none; filter: none; }
      .spine, .credit { display: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <article class="box" aria-label="Amy Chess fantasy ColecoVision box">
      <section class="panel front">
        <header class="brand">
          <div class="brand__mark">C</div>
          <div class="brand__system">COLECO<span>VISION</span></div>
          <div class="brand__badge">VIDEO GAME<br>CARTRIDGE</div>
        </header>
        <div class="hero">
          <div class="screen-frame">
            <img src="assets/amy-chess-title-edited.png" alt="Amy Chess title screen">
          </div>
        </div>
        <footer class="front-copy">
          <strong>Strategy with personality</strong>
          <small>Full chess rules · Human or computer players · BLITZ and NORMAL play · Spoken results</small>
          <div class="seal">AMY<br>BIENVENU'S</div>
        </footer>
      </section>
      <aside class="panel spine"><span>Amy Chess · Amy Bienvenu</span></aside>
    </article>
    <p class="credit">Unofficial concept box · Created with Amy Studio</p>
  </main>
</body>
</html>
